services:
  app:
    image: "inventory-manager"
    container_name: "inventory-manager-app"
    build: .
    init: true
    shm_size: "512mb"
    ports:
      - "3000:3000"
    env_file: .env
    restart: unless-stopped

  osrm:
    image: "ghcr.io/project-osrm/osrm-backend:latest"
    container_name: "inventory-manager-osrm"
    command: osrm-routed --algorithm mld /data/idf-elargie.osrm
    volumes:
      - ./osrm-data:/data
    ports:
      - "3001:5000"
    restart: unless-stopped